[project]
name = "dato-tune"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
packages = ["item_estimation", "propagation_parameters_estimation"]
dependencies = [
    "gitpython>=3.1.46",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numba>=0.63.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "polars>=1.39.3",
    "rich>=14.3.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "snowflake-connector-python[pandas]>=4.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "item_estimation"
module-root = ""

[tool.uv]
required-version = ">=0.11.6"
exclude-newer = "7 days"
